# .github/workflows/ci.yml
# GitHub Actions CI Pipeline for HabitFlow

name: HabitFlow CI

# متى يتم تشغيل الاختبارات؟
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# المهام التي ستنفذ
jobs:
  # المهمة 1: اختبار الكود
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      # 1. تحميل الكود من GitHub
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. إعداد بيئة Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # 3. تثبيت dependencies
      - name: 📦 Install dependencies
        run: npm ci
      
      # 4. تشغيل الاختبارات
      - name: 🧪 Run tests
        run: npm test
      
      # 5. رفع تقرير التغطية (coverage)
      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # المهمة 2: التحقق من صحة HTML/CSS/JS (اختياري)
  lint:
    name: 🔍 Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Check HTML validity
        run: npx html-validate index.html || true
      
      - name: 🎨 Check CSS (using stylelint)
        run: npx stylelint "*.css" || true

  # المهمة 3: بناء المشروع (للتحقق من عدم وجود أخطاء)
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Check build
        run: |
          echo "✅ Build check passed!"
          echo "📁 Files in repository:"
          ls -la